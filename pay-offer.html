<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay for Offer | Vora</title>
  <link rel="icon" type="image/svg+xml" href="/vora-logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.paystack.co/v2/inline.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-xl items-center justify-between px-5">
      <a href="my-requests.html" class="inline-flex h-10 w-10 items-center justify-center rounded-full hover:bg-" aria-label="Back to requests">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span class="text-base font-bold">Review offer</span>
      <span class="w-10" aria-hidden="true"></span>
    </div>
  </header>

  <main class="mx-auto max-w-xl px-5 py-8 pb-36">
    <section class="rounded-3xl bg-gradient-to-br from-blue-600 to-indigo-700 p-6 text-white shadow-lg shadow-blue-900/15">
      <div class="flex items-start justify-between gap-5">
        <div>
          <p class="text-sm font-medium text-white/65">Your provider offer</p>
          <h1 id="service-title" class="mt-2 text-3xl font-bold leading-tight">Loading your offer…</h1>
          <p id="booking-location" class="mt-3 text-sm leading-6 text-white/70">Loading location…</p>
        </div>
        <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-white/15 text-white ring-1 ring-white/25">
          <svg viewBox="0 0 24 24" class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 17.5h16M6 17.5l1.3-6.2A2 2 0 0 1 9.25 9.7h5.5a2 2 0 0 1 1.95 1.6L18 17.5M7 17.5V20m10-2.5V20M8.5 13h.01M15.5 13h.01"/><path d="M3 7.5h18"/></svg>
        </div>
      </div>
    </section>

    <section class="mt-5 overflow-hidden rounded-3xl bg-white shadow-sm ring-1 ring-black/5">
      <div class="relative h-36 overflow-hidden bg-blue-50">
        <div class="absolute inset-0 opacity-70" style="background-image:linear-gradient(30deg, transparent 48%, #bfdbfe 49%, #bfdbfe 51%, transparent 52%),linear-gradient(115deg, transparent 48%, #c7d2fe 49%, #c7d2fe 51%, transparent 52%);background-size:90px 70px,120px 90px;"></div>
        <div class="absolute left-[18%] top-7 h-4 w-4 rounded-full border-4 border-white bg-blue-600 shadow"></div>
        <div class="absolute bottom-7 right-[19%] h-4 w-4 rounded-full border-4 border-white bg-indigo-600 shadow"></div>
        <svg viewBox="0 0 320 120" class="absolute inset-0 h-full w-full" fill="none"><path d="M61 38c55 4 75 62 138 47 24-6 42-20 65-22" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/></svg>
      </div>
      <div class="p-5">
        <div class="flex items-center justify-between gap-4">
          <div class="flex min-w-0 items-center gap-3">
            <img id="provider-picture" src="https://ui-avatars.com/api/?name=Provider&background=111111&color=ffffff" alt="Provider" class="h-12 w-12 rounded-full bg-slate-200 object-cover">
            <div class="min-w-0"><p class="text-xs font-medium text-slate-500">Provider</p><p id="provider-name" class="truncate text-base font-bold">Loading…</p></div>
          </div>
          <span class="rounded-full bg-blue-50 px-3 py-1.5 text-xs font-bold text-blue-700">Offer accepted</span>
        </div>
        <div class="mt-5 grid grid-cols-2 gap-3 border-t border-[#eeeeee] pt-5">
          <div><p class="text-xs font-medium text-slate-500">Date</p><p id="booking-date" class="mt-1 text-sm font-bold">—</p></div>
          <div><p class="text-xs font-medium text-slate-500">Time</p><p id="booking-time" class="mt-1 text-sm font-bold">—</p></div>
        </div>
        <div id="booking-instructions-div" class="mt-5 hidden rounded-2xl bg-[#f6f6f6] p-4"><p class="text-xs font-bold text-slate-500">YOUR REQUEST</p><p id="booking-instructions" class="mt-2 whitespace-pre-line text-sm leading-6 text-slate-700"></p></div>
      </div>
    </section>

    <section class="mt-5 rounded-3xl bg-white p-5 shadow-sm ring-1 ring-black/5">
      <h2 class="text-lg font-bold">Payment details</h2>
      <div class="mt-5 space-y-4 text-sm">
        <div class="flex justify-between"><span class="text-slate-600">Provider offer</span><span id="per-person-price" class="font-semibold">NGN 0</span></div>
        <div class="flex justify-between"><span class="text-slate-600">Service fee</span><span id="service-fee" class="font-semibold">NGN 0</span></div>
        <div id="travel-fee-breakdown" class="hidden justify-between"><span class="text-slate-600">Travel fee</span><span id="travel-fee-breakdown-value" class="font-semibold">NGN 0</span></div>
        <div id="travel-fee-card" class="hidden"></div>
        <div class="flex items-end justify-between border-t border-[#eeeeee] pt-4"><span class="font-bold">Total</span><span id="service-price-total" class="text-2xl font-bold">NGN 0</span></div>
      </div>
      <p class="mt-5 flex items-center gap-2 text-xs leading-5 text-slate-500"><svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Payments are securely processed by Paystack.</p>
    </section>
    <span id="booking-people" class="hidden">1</span>
    <span id="service-price-summary" class="hidden">NGN 0</span>
    <p id="payment-error" class="mt-4 hidden rounded-2xl bg-red-50 p-4 text-sm text-red-700"></p>
  </main>

  <footer class="fixed inset-x-0 bottom-0 border-t border-slate-200 bg-white/95 px-5 py-4 backdrop-blur">
    <div class="mx-auto max-w-xl">
      <button id="confirm-booking-btn" class="w-full rounded-2xl bg-indigo-600 px-5 py-4 text-base font-bold text-white shadow-lg shadow-indigo-600/25 transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-400">Pay with Paystack</button>
    </div>
  </footer>
  <script src="./pay-offer.js" type="module"></script>
</body>
</html>
