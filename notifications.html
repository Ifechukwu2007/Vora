<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | Vora</title>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

<!-- HEADER -->
<header class="fixed top-0 left-0 w-full bg-white shadow-sm border-b border-gray-200 z-50">
  <div class="flex items-center gap-3 p-4 max-w-3xl mx-auto">
    <a href="javascript:history.back()"
       class="text-3xl font-bold text-gray-800 hover:text-black">
      ‹
    </a>

    <div>
      <h1 class="text-lg font-bold">Notifications</h1>
      <p class="text-xs text-gray-500">Your recent activity and updates</p>
    </div>

    <div class="ml-auto">
      <button id="markAll" class="text-sm font-semibold text-blue-600 hover:text-blue-700">
        Mark all as read
      </button>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="pt-24 max-w-3xl mx-auto p-4">
  <div class="mb-4 rounded-2xl border border-gray-200 bg-white p-4 shadow-sm">
    <div class="flex items-center justify-between gap-3">
      <div>
        <h2 class="font-bold text-lg">Your updates</h2>
        <p class="text-sm text-gray-500">New messages, bookings, payments, and more</p>
      </div>
      <div class="rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700">
        Live feed
      </div>
    </div>
  </div>

  <div id="list" class="space-y-2">
    <div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm">
      <p class="text-sm text-gray-500">Loading notifications...</p>
    </div>
  </div>
</main>

<script src="./auth.js" type="module"></script>
<script src="./notifications.js" type="module"></script>
    <script type="module">
      import { supabase } from './supabase.js'

      console.log(supabase)
    </script>
</body>
</html>
